<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JERLOORXHCK • Secure Gateway</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#9cff00;font-family:Arial,Helvetica,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0}.scan{position:fixed;inset:0;z-index:1;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 1px,transparent 1px 4px)}
.wrap{position:relative;z-index:2;height:100%;display:flex;align-items:center;justify-content:center;padding:15px}
.card{width:min(94vw,430px);padding:22px 18px 24px;border:1px solid #82ff00;border-radius:22px;background:rgba(0,5,0,.80);box-shadow:0 0 35px rgba(125,255,0,.25),inset 0 0 40px rgba(125,255,0,.04);backdrop-filter:blur(5px);animation:in .8s ease}
@keyframes in{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.logo{width:165px;height:165px;object-fit:cover;border-radius:50%;border:2px solid #89ff00;box-shadow:0 0 20px #69c900;animation:pulse 2s infinite}
@keyframes pulse{50%{transform:scale(1.025);box-shadow:0 0 32px #8cff00,0 0 70px rgba(105,201,0,.35)}}
h1{color:#fff;font-size:24px;letter-spacing:4px;margin:14px 0 3px}h1 span{color:#9cff00}.sub{font:10px monospace;letter-spacing:3px;color:#68a844;margin-bottom:15px}
.term{font:11px monospace;text-align:left;padding:12px;border:1px solid #274719;border-radius:11px;background:rgba(0,10,0,.7);line-height:1.7;margin-bottom:13px}.ok{color:#9cff00}.dim{color:#4d7738}
input{width:100%;padding:14px;border:1px solid #3d6c22;border-radius:11px;background:#020602;color:white;text-align:center;letter-spacing:3px;font-size:15px;outline:none}input:focus{border-color:#9cff00;box-shadow:0 0 18px rgba(156,255,0,.22)}
button{width:100%;padding:14px;margin-top:10px;border:0;border-radius:11px;background:#9cff00;color:#061000;font-weight:900;letter-spacing:2px;cursor:pointer}button:hover{box-shadow:0 0 25px rgba(156,255,0,.45)}
#error{height:19px;margin-top:8px;color:#ff5555;font:11px monospace}.foot{font:9px monospace;color:#4c7138;letter-spacing:1px;margin-top:13px}
#create{display:block;margin-top:10px;color:#6ea64b;font:10px monospace;text-decoration:none}#create:hover{color:#b9ff80}
</style>
</head>
<body>
<canvas id="matrix"></canvas><div class="scan"></div>
<div class="wrap"><section class="card">
<img class="logo" src="jerloorxhck.png" alt="JERLOORXHCK">
<h1>JERLOOR<span>XHCK</span></h1>
<div class="sub">AES-256 SECURE MESSAGE GATEWAY</div>
<div class="term">
<span class="dim">&gt; initializing secure channel...</span><br>
<span>&gt; encrypted payload: <b class="ok">DETECTED</b></span><br>
<span>&gt; AES-GCM authentication: <b class="ok">READY</b></span><br>
<span>&gt; message status: <b class="ok">LOCKED</b></span>
</div>
<input id="key" type="password" placeholder="ENTER SECRET KEY" autocomplete="off">
<button id="unlock">⚡ DECRYPT MESSAGE</button>
<div id="error"></div>
<a id="create" href="create.html">CREATE A NEW SECRET MESSAGE →</a>
<div class="foot">FROM JERLOORXHCK • END-TO-END CLIENT-SIDE ENCRYPTION</div>
</section></div>
<script>
const c=document.getElementById("matrix"),x=c.getContext("2d"),font=15;let W,H,cols,drops;
function resize(){W=c.width=innerWidth;H=c.height=innerHeight;cols=Math.ceil(W/font);drops=Array(cols).fill(1)}addEventListener("resize",resize);resize();
const chars="01ABCDEFGHIJKLMNOPQRSTUVWXYZ#$%&<>[]{}";
setInterval(()=>{x.fillStyle="rgba(0,0,0,.075)";x.fillRect(0,0,W,H);x.font=font+"px monospace";for(let i=0;i<drops.length;i++){x.fillStyle=Math.random()>.94?"#d7ff9b":"#54b51d";x.fillText(chars[(Math.random()*chars.length)|0],i*font,drops[i]*font);if(drops[i]*font>H&&Math.random()>.975)drops[i]=0;drops[i]++}},45);

function tone(freq,dur,delay=0){setTimeout(()=>{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const a=new A(),o=a.createOscillator(),g=a.createGain();o.frequency.value=freq;o.type="sine";g.gain.setValueAtTime(.0001,a.currentTime);g.gain.exponentialRampToValueAtTime(.06,a.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+dur);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+dur+.03)},delay)}
function b64u(s){return s.replace(/-/g,"+").replace(/_/g,"/")+ "=".repeat((4-s.length%4)%4)}
function ub64(s){const bin=atob(b64u(s));return Uint8Array.from(bin,c=>c.charCodeAt(0))}
async function decryptMessage(password){
 const raw=location.hash.startsWith("#data=")?location.hash.slice(6):"";
 if(!raw)throw Error("NO_PAYLOAD");
 const bytes=ub64(raw),salt=bytes.slice(0,16),iv=bytes.slice(16,28),ct=bytes.slice(28);
 const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(password),"PBKDF2",false,["deriveKey"]);
 const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:250000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
 const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,ct);
 return JSON.parse(new TextDecoder().decode(plain));
}
async function unlock(){
 const e=document.getElementById("error"),key=document.getElementById("key").value;
 if(!location.hash.startsWith("#data=")){e.textContent="> NO ENCRYPTED MESSAGE IN THIS LINK";return}
 if(!key){e.textContent="> ENTER YOUR SECRET KEY";return}
 try{
 const payload=await decryptMessage(key);
 if(payload.expiresAt && Date.now()>=payload.expiresAt){
   tone(150,.18);e.style.color="#ff5555";e.textContent="> MESSAGE EXPIRED — ACCESS PERMANENTLY BLOCKED";return;
 }
 tone(660,.08);tone(880,.12,100);e.style.color="#9cff00";e.textContent="> ACCESS GRANTED — AUTHENTICATING...";
 sessionStorage.setItem("pendingKey",key);
 setTimeout(()=>location.href="message.html",500)
}catch{tone(150,.15);e.style.color="#ff5555";e.textContent="> ACCESS DENIED — WRONG KEY OR CORRUPTED MESSAGE"}}
document.getElementById("unlock").onclick=unlock;
document.getElementById("key").onkeydown=e=>{if(e.key==="Enter")unlock()};
</script>
</body></html>
